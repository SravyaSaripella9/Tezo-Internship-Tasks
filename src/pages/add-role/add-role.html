<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Role</title>
    <link rel="stylesheet" href="../../../root/styles.css" />
    <link rel="stylesheet" href="add-role-styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <header>
            <div class="header">
                <div class="header-logo">
                    <img src="../../../assets/tezologo.svg" alt="logo" />
                </div>
                <div class="side-arrow">
                    <img src="../../../assets/sidearrow.png" alt="sidearrow" onclick="displaySideNav()"/>
                </div>
                <div class="main-navigation">
                    <div class="search">
                        <div class="search-icon">
                            <img src="../../../assets/search.png" alt="search-icon" />
                        </div>
                        <div class="search-bar">
                            <input type="text" placeholder="Search">
                        </div>
                    </div>
                    <div class="header-icons">
                        <div class="icons">
                            <div><img src="../../../assets/language.png" alt="language" /></div>
                            <div><img src="../../../assets/card.png" alt="card-icon" /></div>
                            <div><img src="../../../assets/mode.png" alt="moon" /></div>
                            <div><img src="../../../assets/notifications.png" alt="notifications" /></div>
                        </div>
                        <div class="account">
                            <div class="profile-photo">
                                <img src="../../../assets/profilephoto.png" alt="profile-photo" />
                            </div>
                            <div class="profile-details">
                                <div id="name">John Abraham</div>
                                <div id="role">Admin</div>
                            </div>
                            <div class="down-arrow">
                                <img src="../../../assets/down-arrow.png" alt="down-arrow" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <div class="main-container">
            <div class="side-navigation">
                <div class="side-navigation-top">
                    <div class="side-navigation-component">
                        <div class="component-heading">ALL</div>
                        <div class="all-sub-components">
                            <div>
                                <a href="#" title="Dashboard">
                                    <div class="component-img">
                                        <img src="../../../assets/dashboard-black.svg" class="black-image" />
                                        <img src="../../../assets/dashboard-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Dashboard</div>
                                </a>
                            </div>
                        </div>
                        <div class="all-sub-components">
                            <div>
                                <a href="../employees/employees.html" title="Employees">
                                    <div class="component-img">
                                        <img src="../../../assets/employees-black.svg" class="black-image" />
                                        <img src="../../../assets/employees-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Employees</div>
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="side-navigation-component">
                        <div class="component-heading">ROLE / USER MANAGEMENT</div>
                        <div class="management-sub-components">
                            <div>
                                <a class="active" href="../roles/roles.html" title="Roles">
                                    <div class="component-img">
                                        <img src="../../../assets/roles-black.svg" class="black-image" />
                                        <img src="../../../assets/roles-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Roles</div>
                                </a>
                            </div>
                        </div>
                        <div class="management-sub-components">
                            <div>
                                <a href="#" title="Access rights">
                                    <div class="component-img">
                                        <img src="../../../assets/assign-user-black.svg" class="black-image" />
                                        <img src="../../../assets/assign-user-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Access rights</div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="side-navigation-bottom">
                    <div class="update-box">
                        <div id="updateHeading">Install new update 2.3.1A</div>
                        <div id="updateContent">Allow to launch the new update for the AD application</div>
                        <div class="buttons">
                            <button class="dismiss-button" title="Dismiss">Dismiss</button>
                            <button class="accept-button" title="Accept">Accept</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="main-body">
                <div class="add-role">
                    <div class="add-role-heading">Create New Role</div>
                    <div class="add-role-form">
                        <form id="addRoleForm">
                            <div class="input-fields">
                                <div class="input-field">
                                    <label for="roleName">Role Name</label>
                                    <input type="text" id="roleName" />
                                </div>
                                <div class="input-field">
                                    <label for="department">Department</label>
                                    <select name="department" id="department"></select>
                                </div>
                            </div>
                            <div class="input-field">
                                <label for="roleDescription">Description</label>
                                <textarea id="roleDescription" rows="8" cols="20" placeholder="Text"></textarea>
                            </div>
                            <div class="input-field">
                                <label for="location">Location</label>
                                <select name="location" id="location"></select>
                            </div>
                            <div class="input-field">
                                <div class="assign-employees-label">Assign employees</div>
                                <div class="assign-employees-options">
                                    <div class="search-employee" onclick="toggleAssignEmployeesDropdown()">
                                        <input type="search" placeholder="Search for an employee" name="searchemployee" onkeyup="searchEmployee()"/>
                                        <img src="../../../assets/black-down-arrow.png" alt="Down-Arrow" />
                                    </div>
                                    <div class="assign-employees"></div>
                                </div>
                            </div>
                            <div class="form-buttons">
                                <button value="Cancel" type="reset" id="cancelButton" onclick="navigateToRolesPage()">Cancel</button>
                                <button value="Add Role" type="submit" id="submitButton" onclick="addRole()">Add Role</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../../../dist/pages/add-role/add-role.js"></script>
</body>
</html>
