<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/add-employee-styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <header>
            <div class="header">
                <div class="header-logo">
                    <img src="assets/tezologo.svg" alt="logo" />
                </div>
                <div class="side-arrow">
                    <img src="assets/sidearrow.png" alt="sidearrow" onclick="displaySideNav()"/>
                </div>
                <div class="main-navigation">
                    <div class="search">
                        <div class="search-icon">
                            <img src="assets/search.png" alt="search-icon" />
                        </div>
                        <div class="search-bar">
                            <input type="text" placeholder="Search">
                        </div>
                    </div>
                    <div class="header-icons">
                        <div class="icons">
                            <div><img src="assets/language.png" alt="language" /></div>
                            <div><img src="assets/card.png" alt="card-icon" /></div>
                            <div><img src="assets/mode.png" alt="mode" /></div>
                            <div><img src="assets/notifications.png" alt="notifications" /></div>
                        </div>
                        <div class="account">
                            <div class="profile-photo">
                                <img src="assets/profilephoto.png" alt="profile-photo" />
                            </div>
                            <div class="profile-details">
                                <div id="name">John Abraham</div>
                                <div id="role">Admin</div>
                            </div>
                            <div class="down-arrow">
                                <img src="assets/down-arrow.png" alt="down-arrow" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <div class="main-container">
            <div class="side-navigation">
                <div class="side-navigation-top">
                    <div class="side-navigation-component">
                        <div class="component-heading">ALL</div>
                        <div class="all-sub-components">
                            <div>
                                <a href="#" title="Dashboard">
                                    <div class="component-img">
                                        <img src="assets/dashboard-black.svg" class="black-image" />
                                        <img src="assets/dashboard-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Dashboard</div>
                                </a>
                            </div>
                        </div>
                        <div class="all-sub-components">
                            <div>
                                <a class="active" href="employees.html" title="Employees">
                                    <div class="component-img">
                                        <img src="assets/employees-black.svg" class="black-image" />
                                        <img src="assets/employees-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Employees</div>
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="side-navigation-component">
                        <div class="component-heading">ROLE / USER MANAGEMENT</div>
                        <div class="management-sub-components">
                            <div>
                                <a href="roles.html" title="Roles">
                                    <div class="component-img">
                                        <img src="assets/roles-black.svg" class="black-image" />
                                        <img src="assets/roles-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Roles</div>
                                </a>
                            </div>
                        </div>
                        <div class="management-sub-components">
                            <div>
                                <a href="#" title="Access rights">
                                    <div class="component-img">
                                        <img src="assets/assign-user-black.svg" class="black-image" />
                                        <img src="assets/assign-user-red.svg" class="red-image" />
                                    </div>
                                    <div class="component-text">Access Rights</div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="side-navigation-bottom">
                    <div class="update-box">
                        <div id="updateHeading">Install new update 2.3.1A</div>
                        <div id="updateContent">Allow to launch the new update for the AD application</div>
                        <div class="buttons">
                            <button class="dismiss-button" title="Dismiss">Dismiss</button>
                            <button class="accept-button" title="Accept">Accept</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="main-body">
                <div class="add-employee">
                    <div class="add-employee-heading">Add Employee</div>
                    <div class="add-employee-form">
                        <form id="addEmployeeForm">
                            <div class="add-employee-profile">
                                <label for="imageInput"><img src="assets/employee-profile.png" alt="Employee Profile Image" id="employeeImage"/></label>
                                <input type="file" name="image" class="image-input" id="imageInput" accept="image/*" onchange="uploadImage()">
                                <button onclick="document.getElementById('imageInput').click()">Upload Profile Picture</button> 
                            </div>
                            <div class="information">
                                <div class="personal-information">
                                    <div class="information-heading">Personal Information</div>
                                    <div class="input-field">
                                        <label for="empNo">Emp No</label>
                                        <input type="text" id="empNo" required placeholder="Text" />
                                    </div>
                                    <div class="input-fields">
                                        <div class="input-field">
                                            <label for="firstName">First Name</label>
                                            <input type="text" id="firstName" required placeholder="Text" />
                                        </div>
                                        <div class="input-field">
                                            <label for="lastName">Last Name</label>
                                            <input type="text" id="lastName" required placeholder="Text" />
                                        </div>
                                        <div class="input-field">
                                            <label for="dob">Date of Birth</label>
                                            <div class="date-of-birth-field">
                                                <img src="assets/calendar.png" />
                                                <input type="text" id="dob" required placeholder="Select" onfocus="(this.type='date')" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="input-fields">
                                        <div class="input-field">
                                            <label for="mail">Email Id</label>
                                            <input type="email" id="mail" required placeholder="Joe.j@technovert.com" />
                                        </div>
                                        <div class="input-field">
                                            <label for="contactNo">Mobile Number</label>
                                            <input type="tel" id="contactNo" placeholder="0000000000" />
                                        </div>
                                    </div>
                                </div>
                                <div class="employment-information">
                                    <div class="information-heading">Employment Information</div>
                                    <div class="input-fields">
                                        <div class="input-field">
                                            <label for="joinDate">Joining Date</label>
                                            <input type="text" id="joinDate" required placeholder="12/08/2023" onfocus="(this.type='date')" />
                                        </div>
                                        <div class="input-field">
                                            <label for="location">Location</label>
                                            <select name="location" id="location" onchange="handleChange('location')"></select>
                                        </div>
                                    </div>
                                    <div class="input-fields">
                                        <div class="input-field">
                                            <label for="jobTitle">Job Title</label>
                                            <select name="job-title" id="jobTitle" onchange="handleChange('jobTitle')"></select>
                                        </div>
                                        <div class="input-field">
                                            <label for="department">Department</label>
                                            <select name="department" id="department" onchange="handleChange('department')"></select>
                                        </div>
                                    </div>
                                    <div class="input-fields">
                                        <div class="input-field">
                                            <label for="manager">Assign Manager</label>
                                            <select name="assign-manager" id="manager"></select>
                                        </div>
                                        <div class="input-field">
                                            <label for="project">Assign Project</label>
                                            <select name="assign-project" id="project">
                                                <option value="Search" selected disabled hidden>Search</option>
                                                <option value="GeoBlue">GeoBlue</option>
                                                <option value="GoDaddy">GoDaddy</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-buttons" id="formButtons">
                                    <button value="Cancel" type="reset" id="cancelButton" onclick="navigateToEmployeesPage()">Cancel</button>
                                    <button value="Add Employee" type="submit" id="submitButton" onclick="addEmployee()">Add Employee</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script/index.js"></script>
    <script src="script/add-employee.js"></script>
</body>
</html>
